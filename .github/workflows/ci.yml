name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop, "codex/**" ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Add project directory to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/backend:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Get changed Python files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.py
          separator: '\n'

      - name: Run complexipy on changed files
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          changed="${{ steps.changed.outputs.all_changed_files }}"
          if [ -n "$changed" ]; then
            mapfile -t files <<< "$changed"
            uv run complexipy "${files[@]}" --max-complexity-allowed 999
          fi

      - name: Run Ruff linting
        run: PYTHONPATH=backend:. uv run ruff check .

      - name: Check code formatting
        run: PYTHONPATH=backend:. uv run ruff format --check .

      - name: Run type checking
        run: cd backend && PYTHONPATH=. uv run pyright .

      - name: Run tests
        run: PYTHONPATH=backend:. uv run pytest backend/tests
